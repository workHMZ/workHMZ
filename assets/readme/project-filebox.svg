<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-labelledby="title desc">
<title id="title">R2FileBox</title>
<desc id="desc">A file. A pickup code. A simpler way to share. Resumable uploads. Expiring shares. View the source on GitHub.</desc>
<rect x="1" y="1" width="1198" height="336" rx="4" fill="#f3f0e7" stroke="#d2cfc3"/>
<rect x="1" y="1" width="6" height="336" rx="0" fill="#9bc8ba"/>
<text x="48" y="42" font-family="'Courier New', monospace" font-size="16" font-weight="400" fill="#616358" letter-spacing="0.3">03 / PRODUCT / FILE SHARING</text>
<text x="46" y="97" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#242522" letter-spacing="-1.6">R2FileBox</text>
<path d="M1134 45l22-22m-22 0h22v22" fill="none" stroke="#242522" stroke-width="3"/>
<text x="48" y="145" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#242522" letter-spacing="0">A file. A pickup code.</text>
<text x="48" y="181" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#242522" letter-spacing="0">A simpler way to share.</text>
<text x="48" y="221" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#616358" letter-spacing="0">Resumable uploads. Expiring shares.</text>
<text x="48" y="270" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#616358" letter-spacing="0">Vue / Workers / R2 / D1</text>
<text x="48" y="307" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#242522" letter-spacing="0">EXPLORE THE REPOSITORY</text>
<g transform="translate(651 67)">
<rect x="0" y="0" width="501" height="238" rx="3" fill="#252825"/>
<text x="24" y="34" font-family="'Courier New', monospace" font-size="15" font-weight="400" fill="#9bc8ba" letter-spacing="0">SMALL INTERFACE. REAL ENGINEERING.</text>
<path d="M24 52h453" stroke="#4b5145"/>
<text x="24" y="89" font-family="'Courier New', monospace" font-size="15" font-weight="400" fill="#c0c6b5" letter-spacing="0">UPLOAD</text>
<text x="152" y="91" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#f3f0e7" letter-spacing="0">Resume interrupted transfers</text>
<text x="24" y="132" font-family="'Courier New', monospace" font-size="15" font-weight="400" fill="#c0c6b5" letter-spacing="0">SHARE</text>
<text x="152" y="134" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#f3f0e7" letter-spacing="0">A code, link or QR</text>
<text x="24" y="175" font-family="'Courier New', monospace" font-size="15" font-weight="400" fill="#c0c6b5" letter-spacing="0">STORE</text>
<text x="152" y="177" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#f3f0e7" letter-spacing="0">Deduplicate the content</text>
<text x="24" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9bc8ba" letter-spacing="0">Independent shares. Automatic expiry.</text>
